[tasks.build]
description = "Minify the compiled Tailwind CSS"
run = "npm run build:css"

[tasks.test]
description = "Run the PHPUnit suite"
run = "npm test"

[tasks.lint]
description = "PHP syntax check across all tracked PHP files"
run = "npm run test:syntax"

[tasks."integration-test"]
description = "Run the Playwright browser integration tests against an isolated PHP server"
run = "npx playwright test"

[tasks.reset_password]
description = "Reset a user's password: mise run reset_password -- <username> <password>"
run = "php bin/reset_password"
